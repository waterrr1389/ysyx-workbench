[binaries]
c       = ['ccache', 'riscv64-linux-gnu-gcc']
ar      = 'riscv64-linux-gnu-ar'
strip   = 'riscv64-linux-gnu-strip'
objcopy = 'riscv64-linux-gnu-objcopy'
objdump = 'riscv64-linux-gnu-objdump'

[host_machine]
system     = 'none'
cpu_family = 'riscv32'
cpu        = 'rv32im'
endian     = 'little'

[properties]
# Selects the ISA and platform blocks in abstract-machine/meson.build.
am_arch = 'riscv32-nemu'
